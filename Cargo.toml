[package]
name = "health-event-ledger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
csv = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
